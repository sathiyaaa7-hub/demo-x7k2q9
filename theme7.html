<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme toggle - theme7 advanced dual-layer demos</title>
<style>
@font-face{font-family:'Tinos';font-style:normal;font-weight:400;font-display:swap;src:url('Tinos_400.woff2') format('woff2')}
@font-face{font-family:'Tinos';font-style:normal;font-weight:700;font-display:swap;src:url('Tinos_700.woff2') format('woff2')}
/* THE KEY IDEA: both themes are REAL, fully painted pages stacked on top of each other.
   A toggle never recolors anything during motion - it only reveals the layer that is
   already painted. Zero recolor block, zero snapshots, transform/opacity only. */
.tl-light{--bg:#F7F7F2;--card:#FFFFFF;--tx:#1c2b23;--mut:#6b7a70;--bd:#d8d5cb;--soft:#eef2ec;--brand:#17643D;--ttl:#12211a;--sub:#55645b;--sh:0 8px 26px #17643d14,0 1px 3px #17643d12;--inbg:#fff;--ph:#9aa79e}
.tl-dark{--bg:#0D1310;--card:#151F19;--tx:#E6EDE8;--mut:#93A39A;--bd:#27352D;--soft:#1B2820;--brand:#2A8A58;--ttl:#DDF0E4;--sub:#A9B8AE;--sh:0 8px 26px #0008,0 1px 3px #0007;--inbg:#101914;--ph:#6B7F73}
:root{--bg:#F7F7F2;--card:#FFFFFF;--tx:#1c2b23;--bd:#d8d5cb;--brand:#17643D;--sh:0 8px 26px #17643d14,0 1px 3px #17643d12}
[data-theme=dark]{--bg:#0D1310;--card:#151F19;--tx:#E6EDE8;--bd:#27352D;--brand:#2A8A58;--sh:0 8px 26px #0008,0 1px 3px #0007}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Times New Roman',Tinos,'Mukta Malar',serif;min-height:100vh}
/* the two pre-painted pages */
.layer{position:fixed;inset:0;overflow:auto;background:var(--bg);color:var(--tx);opacity:0;pointer-events:none}
.layer.on{opacity:1;pointer-events:auto}
.wrap{max-width:420px;margin:0 auto;padding:56px 20px 120px}
.logo{text-align:center;margin-bottom:18px}
.logo b{display:block;font-size:26px;letter-spacing:4px;color:var(--ttl)}
.logo span{font-size:11px;letter-spacing:2.5px;color:var(--mut)}
h1{font-size:22px;margin:0 0 14px;color:var(--ttl)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs div{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:var(--soft);color:var(--mut);font-size:13px}
.tabs .on{background:var(--brand);color:#fff}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--inbg);color:var(--tx);font-size:15px;font-family:inherit}
.inp::placeholder{color:var(--ph)}
.go{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;font-family:inherit}
.fp{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--brand)}
/* toggle button chrome (tiny - the only thing that recolors) */
#tbtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;box-shadow:var(--sh)}
#tbtn .tic{position:absolute;width:22px;height:22px;transition:transform .28s cubic-bezier(.3,.7,.2,1),opacity .22s ease}
#tbtn .isun{transform:scale(0) rotate(-100deg);opacity:0}
#tbtn .imoon{transform:scale(1) rotate(0deg);opacity:1}
[data-theme=dark] #tbtn .isun{transform:scale(1) rotate(0deg);opacity:1}
[data-theme=dark] #tbtn .imoon{transform:scale(0) rotate(100deg);opacity:0}
#dbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);font-size:12px;color:var(--tx);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{padding:5px 10px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:12px;cursor:pointer;font-family:inherit}
.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.rw{position:fixed;border-radius:50%;overflow:hidden;contain:strict;will-change:transform;z-index:40;pointer-events:none}
.bl{position:fixed;border-radius:50%;contain:strict;will-change:transform,opacity;z-index:40;pointer-events:none}
</style></head><body>
<button id="tbtn" aria-label="Theme">
  <svg class="tic imoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2 A8.5 8.5 0 1 1 10.8 3.5 A7 7 0 0 0 20.5 13.2 Z" pathLength="1"/></svg>
  <svg class="tic isun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.9 A4.9 4.9 0 1 0 12 7.1 A4.9 4.9 0 0 0 12 16.9 Z" pathLength="1"/><path d="M12 2.1 V4.1 M12 19.9 V21.9 M4.2 4.2 L5.6 5.6 M18.4 18.4 L19.8 19.8 M2.1 12 H4.1 M19.9 12 H21.9 M4.2 19.8 L5.6 18.4 M18.4 5.6 L19.8 4.2" pathLength="1"/></svg>
</button>
<div id="layers"></div>
<div id="dbar"><b>theme7 - advanced, zero recolor:</b>
  <button class="pill on" data-s="planer">1 Planer</button>
  <button class="pill" data-s="aperture">2 Split</button>
  <button class="pill" data-s="drop">3 Drop</button>
  <button class="pill" id="fx">lowfx: off</button>
</div>
<script>
var style='planer', lowfx=false, busy=false, pre=null, preT=0;
var RM=matchMedia('(prefers-reduced-motion: reduce)');
var PAGE='<div class="wrap"><div class="logo"><b>GLOBAL</b><span>CONSTRUCTION &amp; PROPERTIES</span></div>'
+'<h1>Sign in</h1><div class="card"><div class="tabs"><div>Officials</div><div class="on">Engineers</div><div>Finance</div></div>'
+'<label>Gmail or User ID</label><input class="inp" placeholder="Enter your Gmail or User ID">'
+'<label>Password</label><input class="inp" type="password" placeholder="Enter your password">'
+'<button class="go">Sign in</button><a class="fp">Forgot password?</a></div></div>';
function mkLayer(theme){var d=document.createElement('div');d.className='layer tl-'+theme;d.dataset.theme=theme;d.innerHTML=PAGE;return d}
var LA=mkLayer('light'), LB=mkLayer('dark');
var host=document.getElementById('layers');host.appendChild(LA);host.appendChild(LB);
LA.classList.add('on');
function layerOf(t){return t==='dark'?LB:LA}
function cur(){return document.documentElement.getAttribute('data-theme')}
// flip = show the already-painted layer. No recolor work at all.
function showLayer(n,instant){
  var oldL=layerOf(cur()), newL=layerOf(n);
  document.documentElement.setAttribute('data-theme',n);
  newL.classList.add('on');oldL.classList.remove('on');
}
function btnGeo(){var b=document.getElementById('tbtn').getBoundingClientRect();var cx=b.left+b.width/2,cy=b.top+b.height/2;var rad=Math.ceil(Math.sqrt(Math.max(cx,innerWidth-cx)**2+Math.max(cy,innerHeight-cy)**2))+8;return[cx,cy,rad]}

/* theme7: three advanced choreographies (GPT "guillotine/planer" + Gemini "aperture/sheet",
   verified and hardened). All: pre-painted dual layers, transform/opacity only, no snapshots. */

/* ---- 1 PLANER (Gemini "Architectural Planer"): the new theme sweeps in from the right like a
   drafting sheet pulled across, a 2px hairline seam rides the leading edge, the old page gets
   pushed back with parallax compression, and the incoming sheet overshoots 4px and settles. ---- */
function planer(n){
  var oldL=layerOf(cur()), newL=layerOf(n);
  newL.classList.add('on');newL.style.zIndex='30';newL.style.opacity='1';
  newL.style.transform='translate3d(100%,0,0)';newL.style.willChange='transform';
  var seam=document.createElement('div');
  seam.style.cssText='position:fixed;top:0;bottom:0;left:0;width:2px;background:'+(n==='dark'?'#2A8A58':'#17643D')+';z-index:31;pointer-events:none;will-change:transform,opacity;transform:translate3d(100vw,0,0);opacity:.9';
  document.body.appendChild(seam);
  oldL.style.willChange='transform,opacity';
  newL.getBoundingClientRect();
  document.documentElement.setAttribute('data-theme',n); // tiny button/dbar recolor only
  var D=lowfx?230:320, E='cubic-bezier(0.16,1,0.3,1)';
  var a=newL.animate([
    {transform:'translate3d(100%,0,0)'},
    {transform:'translate3d(-4px,0,0)',offset:0.78},
    {transform:'translate3d(0,0,0)'}],{duration:D,easing:E,fill:'forwards'});
  oldL.animate([
    {transform:'translate3d(0,0,0)',opacity:1},
    {transform:'translate3d(-15%,0,0)',opacity:0.8}],{duration:Math.round(D*0.82),easing:E,fill:'forwards'});
  seam.animate([
    {transform:'translate3d(100vw,0,0)',opacity:0.9},
    {transform:'translate3d(-2px,0,0)',opacity:0.9,offset:0.75},
    {transform:'translate3d(-6px,0,0)',opacity:0}],{duration:D,easing:E,fill:'forwards'});
  document.getElementById('tbtn').animate([{transform:'scale(1)'},{transform:'scale(0.88)',offset:0.4},{transform:'scale(1)'}],{duration:lowfx?180:300,easing:'cubic-bezier(.34,1.56,.64,1)'});
  a.finished.then(function(){oldL.classList.remove('on');oldL.style.willChange='';newL.style.cssText='';seam.remove();busy=false})
    .catch(function(){oldL.classList.remove('on');oldL.style.willChange='';newL.style.cssText='';seam.remove();busy=false});
}

/* ---- 2 SPLIT (Gemini "Aperture", hardened): the CURRENT page itself splits into top/bottom
   halves (real content, cloned into overflow-hidden half masks, pre-built on finger-down) and
   peels apart like a survey shutter while the new theme scales up 0.96->1 underneath. ---- */
function prepSplit(){
  var oldL=layerOf(cur());
  var mk=function(top){
    var h=document.createElement('div');
    h.style.cssText='position:fixed;left:0;width:100vw;height:50vh;overflow:hidden;contain:strict;will-change:transform;z-index:30;pointer-events:none;'+(top?'top:0':'top:50vh');
    var c=oldL.cloneNode(true);c.classList.add('on');c.style.cssText='position:absolute;left:0;width:100vw;height:100vh;opacity:1;'+(top?'top:0':'top:-50vh');
    h.appendChild(c);document.body.appendChild(h);return h;
  };
  var t=mk(true),b=mk(false);
  t.getBoundingClientRect();
  return{t:t,b:b};
}
function dropSplit(pp){
  pp.t.remove();pp.b.remove();
}
function aperture(n){
  if(!pre)pre=prepSplit();
  var pp=pre;pre=null;
  var oldL=layerOf(cur()), newL=layerOf(n);
  newL.classList.add('on');newL.style.zIndex='2';newL.style.opacity='0.8';newL.style.transform='scale(0.96)';newL.style.willChange='transform,opacity';
  newL.getBoundingClientRect();
  document.documentElement.setAttribute('data-theme',n);
  var D=lowfx?190:250;
  var a1=pp.t.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(0,-100%,0)'}],{duration:D,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});
  pp.b.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(0,100%,0)'}],{duration:D,easing:'cubic-bezier(0.22,1,0.36,1)',fill:'forwards'});
  newL.animate([{transform:'scale(0.96)',opacity:0.8},{transform:'scale(1)',opacity:1}],{duration:D+30,easing:'cubic-bezier(0.16,1,0.3,1)',fill:'forwards'});
  document.getElementById('tbtn').animate([{transform:'rotate(0deg)'},{transform:'rotate(180deg)'}],{duration:lowfx?200:320,easing:'cubic-bezier(.3,.7,.3,1)'});
  a1.finished.then(function(){dropSplit(pp);oldL.classList.remove('on');newL.style.cssText='';busy=false})
    .catch(function(){dropSplit(pp);oldL.classList.remove('on');newL.style.cssText='';busy=false});
}

/* ---- 3 DROP (Gemini "Litho Sheet"): the new theme drops from above with heavy momentum while
   the old page recedes (scale down + dim) like a foundation layer; icon squashes and re-springs. ---- */
function drop(n){
  var oldL=layerOf(cur()), newL=layerOf(n);
  newL.classList.add('on');newL.style.zIndex='30';newL.style.opacity='1';
  newL.style.transform='translate3d(0,-100%,0)';newL.style.willChange='transform';
  oldL.style.willChange='transform,opacity';
  newL.getBoundingClientRect();
  document.documentElement.setAttribute('data-theme',n);
  var D=lowfx?210:290;
  var a=newL.animate([
    {transform:'translate3d(0,-100%,0)'},
    {transform:'translate3d(0,0,0)',offset:0.9},
    {transform:'translate3d(0,0,0)'}],{duration:D,easing:'cubic-bezier(0.19,1,0.22,1)',fill:'forwards'});
  oldL.animate([
    {transform:'scale(1)',opacity:1},
    {transform:'scale(0.95)',opacity:0.55}],{duration:Math.round(D*0.65),easing:'ease-out',fill:'forwards'});
  if(!lowfx)document.getElementById('tbtn').animate([
    {transform:'scale(1,1)'},
    {transform:'scale(1.18,0.82)',offset:0.35},
    {transform:'scale(0.96,1.06)',offset:0.7},
    {transform:'scale(1,1)'}],{duration:340,easing:'cubic-bezier(.3,.7,.3,1)'});
  a.finished.then(function(){oldL.classList.remove('on');oldL.style.willChange='';oldL.style.transform='';oldL.style.opacity='';newL.style.cssText='';busy=false})
    .catch(function(){oldL.classList.remove('on');oldL.style.willChange='';oldL.style.transform='';oldL.style.opacity='';newL.style.cssText='';busy=false});
}

function toggle(){
  if(busy)return;busy=true;
  var n=cur()==='dark'?'light':'dark';
  if(RM.matches){showLayer(n,true);busy=false;return}
  if(style==='planer')planer(n);
  else if(style==='aperture')aperture(n);
  else drop(n);
}
function prewarm(){
  if(pre||busy||style!=='aperture')return;
  pre=prepSplit();preT=Date.now();
  setTimeout(function(){if(pre&&Date.now()-preT>=1400){dropSplit(pre);pre=null}},1400);
}
var tb=document.getElementById('tbtn');
tb.addEventListener('pointerdown',prewarm,{passive:true});
tb.addEventListener('click',toggle);
Array.prototype.forEach.call(document.querySelectorAll('[data-s]'),function(p){
  p.addEventListener('click',function(){
    if(pre){dropSplit(pre);pre=null}
    style=p.dataset.s;
    Array.prototype.forEach.call(document.querySelectorAll('[data-s]'),function(x){x.classList.toggle('on',x===p)});
  });
});
document.getElementById('fx').addEventListener('click',function(){
  lowfx=!lowfx;document.getElementById('fx').textContent='lowfx: '+(lowfx?'on':'off');
  document.getElementById('fx').classList.toggle('on',lowfx);
});
</script></body></html>
