<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme toggle animation - demo</title>
<style>
@font-face{font-family:'Tinos';font-style:normal;font-weight:400;font-display:swap;src:url('Tinos_400.woff2') format('woff2')}
@font-face{font-family:'Tinos';font-style:normal;font-weight:700;font-display:swap;src:url('Tinos_700.woff2') format('woff2')}
:root{--bg:#F7F7F2;--card:#FFFFFF;--tx:#1c2b23;--mut:#6b7a70;--bd:#d8d5cb;--soft:#eef2ec;--brand:#17643D;--ttl:#12211a;--sub:#55645b;--sh:0 8px 26px #17643d14,0 1px 3px #17643d12;--inbg:#fff;--ph:#9aa79e}
[data-theme=dark]{--bg:#0D1310;--card:#151F19;--tx:#E6EDE8;--mut:#93A39A;--bd:#27352D;--soft:#1B2820;--brand:#2A8A58;--ttl:#DDF0E4;--sub:#A9B8AE;--sh:0 8px 26px #0008,0 1px 3px #0007;--inbg:#101914;--ph:#6B7F73}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Times New Roman',Tinos,'Mukta Malar',serif;min-height:100vh}
#tbtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;box-shadow:var(--sh)}
#tbtn .tic{position:absolute;width:22px;height:22px;transition:transform .28s cubic-bezier(.3,.7,.2,1),opacity .22s ease}
#tbtn .isun{transform:scale(0) rotate(-100deg);opacity:0}
#tbtn .imoon{transform:scale(1) rotate(0);opacity:1}
[data-theme=dark] #tbtn .isun{transform:scale(1) rotate(0);opacity:1}
[data-theme=dark] #tbtn .imoon{transform:scale(0) rotate(100deg);opacity:0}
@media (prefers-reduced-motion:reduce){#tbtn .tic{transition:none}}
.wrap{max-width:440px;margin:0 auto;padding:76px 20px 40px}
.logo{background:linear-gradient(180deg,#0f3d25,#17643D);border-radius:18px;padding:34px 18px 26px;text-align:center;margin-bottom:22px}
.logo b{display:block;color:#F7F7F2;font-size:30px;letter-spacing:2px}
.logo span{color:#cfe3d5;font-size:11px;letter-spacing:3px}
h1{font-size:26px;margin:0 0 14px;color:var(--ttl)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:20px 19px}
.tabs{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:14px}
.tabs div{flex:1;text-align:center;padding:9px 0;border-radius:8px;font-size:15px;color:var(--sub);font-weight:600}
.tabs .on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px #0002}
label{display:block;font-size:14px;font-weight:600;color:var(--ttl);margin:10px 0 4px}
.inp{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--bd);border-radius:9px;background:var(--inbg);color:var(--tx);font-family:inherit}
.inp::placeholder{color:var(--ph);font-size:12.5px}
.go{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:16.5px;font-weight:700;font-family:inherit}
.fp{display:block;margin-top:14px;font-size:12.5px;color:var(--brand)}
/* demo bar */
#dbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
#dbar b{font-size:12px;color:var(--mut);margin-right:2px}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
/* covers: transform/opacity only */
.cover{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0}
/* style 1: reveal - solid old-bg cover, scale+fade out after flip */
/* style 2: orb - circle grows from the button in NEW bg color, then fades */
#orb{border-radius:50%;width:10px;height:10px;left:0;top:0;contain:strict;pointer-events:none;backface-visibility:hidden}
/* style 3: curtain - slab sweeps down in NEW bg color, flips, sweeps off */
@media (prefers-reduced-motion:reduce){.cover{transition:none!important}}
/* live circle: native view-transition snapshots - no cover layer at all, zero flat frames */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:2147483646}
::view-transition-new(root){z-index:2147483647}
</style></head><body>
<button id="tbtn" aria-label="Theme">
  <svg class="tic imoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2 A8.5 8.5 0 1 1 10.8 3.5 A7 7 0 0 0 20.5 13.2 Z" pathLength="1"/></svg>
  <svg class="tic isun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16.9 A4.9 4.9 0 1 0 12 7.1 A4.9 4.9 0 0 0 12 16.9 Z" pathLength="1"/><path d="M12 2.1 V4.1 M12 19.9 V21.9 M4.2 4.2 L5.6 5.6 M18.4 18.4 L19.8 19.8 M2.1 12 H4.1 M19.9 12 H21.9 M4.2 19.8 L5.6 18.4 M18.4 5.6 L19.8 4.2" pathLength="1"/></svg>
</button>
<div class="wrap">
  <div class="logo"><b>GLOBAL</b><span>CONSTRUCTION &amp; PROPERTIES</span></div>
  <h1>Sign in</h1>
  <div class="card">
    <div class="tabs"><div>Officials</div><div class="on">Engineers</div><div>Finance</div></div>
    <label>Gmail or User ID</label><input class="inp" placeholder="Enter your Gmail or User ID">
    <label>Password</label><input class="inp" type="password" placeholder="Enter your password">
    <button class="go">Sign in</button>
    <a class="fp">Forgot password?</a>
  </div>
</div>
<div id="dbar"><b>Theme animation demo:</b>
  <button class="pill on" data-s="fast">1 Fast circle</button>
  <button class="pill" data-s="vt">2 Native circle</button>
  <button class="pill" data-s="curtain">3 Curtain</button>
  <button class="pill" id="fx">lowfx: off</button>
</div>
<script>
var style='fast', lowfx=false, busy=false, pre=null, preT=0;
var RM=matchMedia('(prefers-reduced-motion: reduce)');
function bgOf(t){return t==='dark'?'#0D1310':'#F7F7F2'}
function cur(){return document.documentElement.getAttribute('data-theme')}
function flip(n){document.documentElement.setAttribute('data-theme',n)}
function btnGeo(){var b=document.getElementById('tbtn').getBoundingClientRect();var cx=b.left+b.width/2,cy=b.top+b.height/2;var rad=Math.ceil(Math.sqrt(Math.max(cx,innerWidth-cx)**2+Math.max(cy,innerHeight-cy)**2))+8;return[cx,cy,rad]}
function mkCover(){var d=document.createElement('div');d.className='cover';document.body.appendChild(d);return d}

// PRE-WARM on pointerdown: a real finger rests ~80-250ms before click fires. Build + position the
// circle, force a style flush and promote its compositor layer in that dead time, so the moment
// click lands there is zero setup work before the first animation frame.
function prewarm(){
  if(pre||busy||style!=='fast')return;
  var g=btnGeo();
  var o=document.createElement('div');o.className='cover';o.id='orb';
  o.style.background=bgOf(cur()==='dark'?'light':'dark');
  o.style.width=o.style.height=(g[2]*2)+'px';o.style.left=(g[0]-g[2])+'px';o.style.top=(g[1]-g[2])+'px';
  o.style.transform='scale(0)';o.style.opacity='1';o.style.willChange='transform,opacity';
  document.body.appendChild(o);
  o.getBoundingClientRect();
  pre={o:o};preT=Date.now();
  setTimeout(function(){if(pre&&pre.o===o){o.remove();pre=null}},1500);
}

// FAST CIRCLE: compositor-only (transform+opacity) cover circle. No page snapshots, no clip-path,
// no double rasterization. Grow+fade are BOTH scheduled up front on the animation clock; the theme
// flips at ~86% grow (only a tiny far-corner crescent uncovered), so the page recolor block overlaps
// the grow's tail and never freezes a visible frame.
function fastCircle(n){
  if(!pre)prewarm();
  if(preT&&Date.now()-preT>1500){pre=null;prewarm()}
  var o=pre.o;pre=null;
  var GD=lowfx?170:230, OD=lowfx?110:160;
  var grow=o.animate(
    [{transform:'scale(0)',opacity:1},{transform:'scale(1)',opacity:1}],
    {duration:GD,easing:'cubic-bezier(.25,.8,.3,1)',fill:'forwards'});
  var out=o.animate(
    lowfx?[{opacity:1},{opacity:0}]:[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.05)'}],
    {duration:OD,delay:GD,easing:'ease-out',fill:'forwards'});
  var flipped=false;
  function doFlip(){if(!flipped){flipped=true;flip(n)}}
  setTimeout(doFlip,Math.round(GD*0.86));
  grow.finished.then(doFlip).catch(doFlip);
  out.finished.then(function(){doFlip();o.remove();busy=false}).catch(function(){doFlip();o.remove();busy=false});
}

// NATIVE CIRCLE: view-transition snapshots, growing circle clip on the new snapshot. Zero flat
// frames but the browser rasterizes the whole page twice per toggle - heavier on slow phones.
function nativeCircle(n){
  var g=btnGeo();
  var vt=document.startViewTransition(function(){flip(n)});
  vt.ready.then(function(){
    document.documentElement.animate(
      {clipPath:['circle(0px at '+g[0]+'px '+g[1]+'px)','circle('+g[2]+'px at '+g[0]+'px '+g[1]+'px)']},
      {duration:400,easing:'cubic-bezier(.25,.8,.3,1)',pseudoElement:'::view-transition-new(root)'});
  }).catch(function(){});
  vt.finished.then(function(){busy=false},function(){busy=false});
}

function toggle(){
  if(busy)return;busy=true;
  var n=cur()==='dark'?'light':'dark';
  if(RM.matches){flip(n);busy=false;return}
  if(style==='fast'){fastCircle(n)}
  else if(style==='vt'){
    if(document.startViewTransition && !lowfx){nativeCircle(n)}
    else{fastCircle(n)}
  }else{
    // curtain: solid slab sweeps down, flip at full cover, sweeps off
    var c2=mkCover();c2.style.background=bgOf(n);c2.style.opacity='1';c2.style.transform='translate3d(0,-100%,0)';
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      c2.style.transition='transform 140ms cubic-bezier(.32,0,.67,0)';
      c2.style.transform='translate3d(0,0,0)';
      setTimeout(function(){
        flip(n);
        c2.style.transition='transform 140ms cubic-bezier(.33,1,.68,1)';
        c2.style.transform='translate3d(0,100%,0)';
        setTimeout(function(){c2.remove();busy=false},170);
      },150);
    })});
  }
}
var tb=document.getElementById('tbtn');
tb.addEventListener('pointerdown',prewarm,{passive:true});
tb.addEventListener('click',toggle);
Array.prototype.forEach.call(document.querySelectorAll('[data-s]'),function(p){
  p.addEventListener('click',function(){
    style=p.dataset.s;
    Array.prototype.forEach.call(document.querySelectorAll('[data-s]'),function(x){x.classList.toggle('on',x===p)});
  });
});
document.getElementById('fx').addEventListener('click',function(){
  lowfx=!lowfx;document.getElementById('fx').textContent='lowfx: '+(lowfx?'on':'off');
  document.getElementById('fx').classList.toggle('on',lowfx);
});
</script></body></html>
